name: Feature request
description: Propose a focused product or developer-experience improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who is blocked, and what is the current workaround?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe observable behavior rather than only implementation.
    validations:
      required: true
  - type: textarea
    id: contracts
    attributes:
      label: Security or compatibility impact
      description: Mention IPC, filesystem access, extensions, persistence, OMP/Pi compatibility, or "None".
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to help test or implement this.
