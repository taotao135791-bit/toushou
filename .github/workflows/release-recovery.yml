name: Recover verified v2.2.0 release

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Immutable application source tag
        type: string
        required: true
        default: v2.2.0
      mac_run_id:
        description: Original Release run containing the verified macOS artifact
        type: string
        required: true
        default: '41667557518'

permissions:
  contents: read
  actions: read

concurrency:
  group: release-recovery-${{ inputs.source_tag }}
  cancel-in-progress: false

jobs:
  windows:
    name: Rebuild and smoke-test original Windows source
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      source_sha: ${{ steps.provenance.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_tag }}
          fetch-depth: 0
      - name: Verify original tag and completed Windows checks
        id: provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          ORIGINAL_RUN: ${{ inputs.mac_run_id }}
        run: |
          set -euo pipefail
          test "$SOURCE_TAG" = v2.2.0
          test "$ORIGINAL_RUN" = 41667557518
          expected=e715e10fb083020d1a14e6d77267c0002e1ffb4e
          source_sha="$(git rev-parse "refs/tags/$SOURCE_TAG^{commit}")"
          test "$source_sha" = "$expected"
          test "$(git rev-parse HEAD)" = "$source_sha"
          test "$(node -p 'require("./package.json").version')" = "${SOURCE_TAG#v}"
          gh api "repos/$GH_REPO/actions/runs/$ORIGINAL_RUN" > "$RUNNER_TEMP/original-run.json"
          workflow_id="$(gh api "repos/$GH_REPO/actions/workflows/release.yml" --jq .id)"
          jq -e --arg repo "$GH_REPO" --arg sha "$source_sha" --arg tag "$SOURCE_TAG" --argjson workflow "$workflow_id" '
            .event == "push" and .run_attempt == 1 and .workflow_id == $workflow and
            .repository.full_name == $repo and .head_repository.full_name == $repo and
            .head_sha == $sha and .head_branch == $tag
          ' "$RUNNER_TEMP/original-run.json" >/dev/null
          gh api "repos/$GH_REPO/actions/runs/$ORIGINAL_RUN/jobs?per_page=100" > "$RUNNER_TEMP/original-jobs.json"
          jq -e '[.jobs[] | select(.name == "Verify and package (Windows)" and .status == "completed") |
            [.steps[] | select(.name == "Typecheck" or .name == "Unit tests" or .name == "Verify pinned OMP version" or .name == "OMP compatibility suite" or .name == "Build app" or .name == "Package Windows installer" or .name == "Verify release assets") | select(.conclusion == "success")] | length == 7] | any' "$RUNNER_TEMP/original-jobs.json" >/dev/null
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile
      - name: Build original application
        run: pnpm build
      - name: Package Windows installer
        run: pnpm exec electron-builder --win nsis --publish never
      - name: Verify Windows assets
        shell: bash
        run: |
          set -euo pipefail
          for asset in TouShou-x64.exe TouShou-x64.exe.blockmap latest.yml; do test -s "release/$asset"; done
          test -s "release/win-unpacked/投手.exe"
          test -s release/win-unpacked/resources/session-topic/index.ts
          test -s release/win-unpacked/resources/appsflyer-toolkit/package.json
          test -s release/win-unpacked/resources/appsflyer-toolkit/extensions/index.ts
      - name: Run updated CI smoke tool against original packaged application
        shell: bash
        timeout-minutes: 3
        env:
          CI_TOOLS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CI_TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$CI_TOOLS_SHA"
          mkdir -p "$RUNNER_TEMP/release-check"
          git show "$CI_TOOLS_SHA:tools/release-smoke.cjs" > "$RUNNER_TEMP/release-check/release-smoke.cjs"
          git show "$CI_TOOLS_SHA:tools/release-smoke-processes.cjs" > "$RUNNER_TEMP/release-check/release-smoke-processes.cjs"
          node --check "$RUNNER_TEMP/release-check/release-smoke.cjs"
          node --check "$RUNNER_TEMP/release-check/release-smoke-processes.cjs"
          echo "Application source is the immutable tag; smoke tooling is workflow commit $CI_TOOLS_SHA."
          node "$RUNNER_TEMP/release-check/release-smoke.cjs" "release/win-unpacked/投手.exe"
      - name: Generate Windows checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum TouShou-x64.exe TouShou-x64.exe.blockmap latest.yml) > release/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TouShou-${{ github.run_id }}-windows-recovery
          if-no-files-found: error
          retention-days: 14
          path: |
            release/TouShou-x64.exe
            release/TouShou-x64.exe.blockmap
            release/latest.yml
            release/SHA256SUMS-windows.txt

  publish:
    name: Verify both artifacts and publish draft
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_tag }}
          fetch-depth: 0
      - name: Verify macOS provenance and download artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          ORIGINAL_RUN: ${{ inputs.mac_run_id }}
          WINDOWS_SHA: ${{ needs.windows.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$SOURCE_TAG" = v2.2.0
          test "$ORIGINAL_RUN" = 41667557518
          expected=e715e10fb083020d1a14e6d77267c0002e1ffb4e
          test "$WINDOWS_SHA" = "$expected"
          test "$(git rev-parse "refs/tags/$SOURCE_TAG^{commit}")" = "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          gh api "repos/$GH_REPO/actions/runs/$ORIGINAL_RUN" > "$RUNNER_TEMP/original-run.json"
          workflow_id="$(gh api "repos/$GH_REPO/actions/workflows/release.yml" --jq .id)"
          jq -e --arg repo "$GH_REPO" --arg sha "$expected" --arg tag "$SOURCE_TAG" --argjson workflow "$workflow_id" '
            .event == "push" and .run_attempt == 1 and .workflow_id == $workflow and
            .repository.full_name == $repo and .head_repository.full_name == $repo and
            .head_sha == $sha and .head_branch == $tag
          ' "$RUNNER_TEMP/original-run.json" >/dev/null
          gh api "repos/$GH_REPO/actions/runs/$ORIGINAL_RUN/jobs?per_page=100" > "$RUNNER_TEMP/original-jobs.json"
          jq -e '[.jobs[] | select(.name == "Verify and package (macOS)" and .status == "completed" and .conclusion == "success")] | length == 1' "$RUNNER_TEMP/original-jobs.json" >/dev/null
          gh api "repos/$GH_REPO/actions/runs/$ORIGINAL_RUN/artifacts?per_page=100" > "$RUNNER_TEMP/original-artifacts.json"
          jq -e --arg name "TouShou-$ORIGINAL_RUN-macos" --arg sha "$expected" '[.artifacts[] | select(.name == $name and .expired == false and .workflow_run.head_sha == $sha)] | length == 1' "$RUNNER_TEMP/original-artifacts.json" >/dev/null
          mkdir -p artifacts/mac artifacts/windows
          gh run download "$ORIGINAL_RUN" --name "TouShou-$ORIGINAL_RUN-macos" --dir artifacts/mac
          gh run download "$GITHUB_RUN_ID" --name "TouShou-$GITHUB_RUN_ID-windows-recovery" --dir artifacts/windows
          git rev-parse "refs/tags/$SOURCE_TAG" > "$RUNNER_TEMP/tag-object"
          git show "$expected:docs/releases/$SOURCE_TAG.md" > "$RUNNER_TEMP/release-notes.md"
      - name: Verify checksums, upload and publish by release ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, re
          mac = ['TouShou-arm64.dmg','TouShou-arm64.dmg.blockmap','TouShou-arm64.zip','TouShou-arm64.zip.blockmap','TouShou-x64.dmg','TouShou-x64.dmg.blockmap','TouShou-x64.zip','TouShou-x64.zip.blockmap','latest-mac.yml']
          win = ['TouShou-x64.exe','TouShou-x64.exe.blockmap','latest.yml']
          for folder, names, checksum in [('artifacts/mac', mac, 'SHA256SUMS.txt'), ('artifacts/windows', win, 'SHA256SUMS-windows.txt')]:
              root = pathlib.Path(folder)
              expected = set(names + [checksum])
              assert {p.name for p in root.iterdir()} == expected, 'Unexpected or missing artifact'
              found = {}
              for name in expected:
                  p = root / name
                  assert p.is_file() and not p.is_symlink() and p.stat().st_size > 0, 'Missing or empty artifact'
              for line in (root / checksum).read_text().splitlines():
                  match = re.fullmatch(r'([0-9a-fA-F]{64}) [ *]([^/\\]+)', line)
                  assert match and match.group(2) not in found, 'Invalid checksum list'
                  found[match.group(2)] = match.group(1).lower()
              assert set(found) == set(names), 'Checksum coverage mismatch'
              for name in names:
                  h = hashlib.sha256()
                  with (root / name).open('rb') as stream:
                      for chunk in iter(lambda: stream.read(1024 * 1024), b''): h.update(chunk)
                  assert h.hexdigest() == found[name], 'Checksum mismatch'
          PY
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$SOURCE_TAG" --jq .object.sha)" = "$(cat "$RUNNER_TEMP/tag-object")"
          # List releases because tag lookup does not reliably expose drafts.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[]' | jq -s --arg tag "$SOURCE_TAG" '[.[] | select(.tag_name == $tag)]' > "$RUNNER_TEMP/matching-releases.json"
          count="$(jq length "$RUNNER_TEMP/matching-releases.json")"
          test "$count" -le 1
          if test "$count" -eq 1; then
            jq -e '.[0].draft == true and (.[0].assets | length == 0)' "$RUNNER_TEMP/matching-releases.json" >/dev/null
            release_id="$(jq -r '.[0].id' "$RUNNER_TEMP/matching-releases.json")"
          else
            jq -n --arg tag "$SOURCE_TAG" --arg sha e715e10fb083020d1a14e6d77267c0002e1ffb4e --rawfile body "$RUNNER_TEMP/release-notes.md" '{tag_name:$tag,target_commitish:$sha,name:("投手 " + $tag),body:$body,draft:true,prerelease:false}' > "$RUNNER_TEMP/new-release.json"
            gh api --method POST "repos/$GH_REPO/releases" --input "$RUNNER_TEMP/new-release.json" > "$RUNNER_TEMP/new-release-response.json"
            jq -e --arg tag "$SOURCE_TAG" '.draft == true and .tag_name == $tag and (.assets | length == 0)' "$RUNNER_TEMP/new-release-response.json" >/dev/null
            release_id="$(jq -r .id "$RUNNER_TEMP/new-release-response.json")"
          fi
          [[ "$release_id" =~ ^[0-9]+$ ]]
          for file in artifacts/mac/* artifacts/windows/*; do
            name="${file##*/}"
            curl --fail --silent --show-error --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@$file" \
              "https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets?name=$name" >/dev/null
          done
          gh api "repos/$GH_REPO/releases/$release_id" > "$RUNNER_TEMP/uploaded-release.json"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          data = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'uploaded-release.json').read_text())
          assert data['draft'] is True and data['tag_name'] == os.environ['SOURCE_TAG'], 'Release changed'
          local = {p.name: p for folder in ['artifacts/mac', 'artifacts/windows'] for p in pathlib.Path(folder).iterdir()}
          remote = data['assets']
          assert len(local) == 14 and len(remote) == 14 and {a['name'] for a in remote} == set(local), 'Uploaded asset set mismatch'
          for asset in remote:
              p = local[asset['name']]
              h = hashlib.sha256()
              with p.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''): h.update(chunk)
              assert asset['state'] == 'uploaded' and asset['size'] == p.stat().st_size and asset['digest'] == 'sha256:' + h.hexdigest(), 'Uploaded asset verification failed'
          PY
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$SOURCE_TAG" --jq .object.sha)" = "$(cat "$RUNNER_TEMP/tag-object")"
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -F draft=false -f make_latest=true > "$RUNNER_TEMP/published-release.json"
          jq -e --arg tag "$SOURCE_TAG" '.draft == false and .tag_name == $tag' "$RUNNER_TEMP/published-release.json" >/dev/null
