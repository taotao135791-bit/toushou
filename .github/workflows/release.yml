name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'tools/release-verify.cjs'
      - 'test/release-verify.test.cjs'
      - 'tools/promote-release-channels.cjs'
      - 'tools/release-smoke.cjs'
      - 'tools/release-smoke-processes.cjs'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Preflight platform (manual runs never publish)'
        type: choice
        required: true
        default: all
        options:
          - all
          - macos
          - windows

# Only the tag publication and channel promotion jobs can write to the repository.
permissions:
  contents: read

# Tags are immutable release identifiers. Never cancel a release while it is
# packaging or uploading its assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Select release platforms
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.plan.outputs.target }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test release selection and verification
        run: node --test test/release-verify.test.cjs
      - name: Check release target, version and source
        id: plan
        env:
          MANUAL_TARGET: ${{ inputs.platform }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node tools/release-verify.cjs plan >> "$GITHUB_OUTPUT"

  build:
    name: Verify and package (macOS)
    needs: plan
    if: needs.plan.outputs.target == 'macos' || needs.plan.outputs.target == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # package.json#packageManager is the single source of truth for pnpm.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # OMP 17.2+ dispatches its CLI through Bun; keep this minimum runtime
      # explicit so a clean macOS runner cannot install `omp` yet fail to run it.
      - name: Set up Bun for OMP
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Read pinned OMP version
        id: pinned
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .omp-compat-version)"
          test -n "${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Pinned OMP version: ${version}"

      - name: Install pinned OMP
        run: npm install -g "@oh-my-pi/pi-coding-agent@${{ steps.pinned.outputs.version }}"

      - name: Verify pinned OMP version
        shell: bash
        run: |
          set -euo pipefail
          command -v omp
          installed="$(omp --version)"
          expected="omp/${{ steps.pinned.outputs.version }}"
          echo "OMP version tested: ${installed}"
          test "${installed}" = "${expected}"

      - name: OMP compatibility suite
        env:
          # The tag must pass against the pinned current OMP. Legacy Pi is
          # independently optional because this release job installs only omp.
          OMP_REQUIRED: omp
        run: pnpm test:omp

      - name: Build app
        run: pnpm build

      - name: Package (signs/notarizes when secrets are configured)
        # Build was already gated above. `--publish never` prevents
        # electron-builder from publishing before checksums are created and the
        # workflow has an auditable list of assets to upload.
        shell: bash
        env:
          # Do not expose empty signing variables as electron-builder inputs:
          # an empty CSC_LINK is interpreted as a local certificate path.
          RELEASE_CSC_LINK: ${{ github.event_name == 'push' && secrets.CSC_LINK || '' }}
          RELEASE_CSC_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.CSC_KEY_PASSWORD || '' }}
          RELEASE_APPLE_ID: ${{ github.event_name == 'push' && secrets.APPLE_ID || '' }}
          RELEASE_APPLE_APP_SPECIFIC_PASSWORD: ${{ github.event_name == 'push' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          RELEASE_APPLE_TEAM_ID: ${{ github.event_name == 'push' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail

          # Keep unsigned builds valid when this repository has no Apple
          # signing secrets. Export all signing/notarization variables only
          # when their required values are actually present.
          if [[ -n "${RELEASE_CSC_LINK:-}" ]]; then
            export CSC_LINK="${RELEASE_CSC_LINK}"
            if [[ -n "${RELEASE_CSC_KEY_PASSWORD:-}" ]]; then
              export CSC_KEY_PASSWORD="${RELEASE_CSC_KEY_PASSWORD}"
            fi
          fi

          if [[ -n "${RELEASE_APPLE_ID:-}" \
            && -n "${RELEASE_APPLE_APP_SPECIFIC_PASSWORD:-}" \
            && -n "${RELEASE_APPLE_TEAM_ID:-}" ]]; then
            export APPLE_ID="${RELEASE_APPLE_ID}"
            export APPLE_APP_SPECIFIC_PASSWORD="${RELEASE_APPLE_APP_SPECIFIC_PASSWORD}"
            export APPLE_TEAM_ID="${RELEASE_APPLE_TEAM_ID}"
          fi

          pnpm exec electron-builder --publish never

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "TouShou-arm64.dmg"
            "TouShou-arm64.zip"
            "TouShou-x64.dmg"
            "TouShou-x64.zip"
            "latest-mac.yml"
          )

          for asset in "${required[@]}"; do
            test -s "release/${asset}" || {
              echo "Missing or empty release asset: release/${asset}"
              exit 1
            }
          done

          # `electron-builder` can reuse a host-architecture Electron bundle
          # when electronDist is pinned locally. Check the staged apps, not
          # just their artifact filenames, before publishing either archive.
          # afterPack adds a shell launcher beside the Mach-O binary. Resolve
          # the declared entry, then inspect its real binary rather than a
          # filesystem-order-dependent find result.
          shopt -s nullglob
          for staged in release/mac-arm64 release/mac; do
            apps=("${staged}"/*.app)
            test "${#apps[@]}" -eq 1
            app_path="${apps[0]}"
            entry="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app_path}/Contents/Info.plist")"
            app_bin="${app_path}/Contents/MacOS/${entry}"
            test -x "${app_bin}"
            if [[ -f "${app_bin}.bin" ]]; then app_bin="${app_bin}.bin"; fi
            test -s "${app_path}/Contents/Resources/session-topic/index.ts"
            test -s "${app_path}/Contents/Resources/mcp-mention/index.ts"
            test -s "${app_path}/Contents/Resources/appsflyer-toolkit/package.json"
            test -s "${app_path}/Contents/Resources/appsflyer-toolkit/extensions/index.ts"
            case "${staged}" in
              release/mac-arm64) file "${app_bin}" | grep -Eq 'arm64|arm64e' ;;
              release/mac) file "${app_bin}" | grep -Eq 'x86_64|x86-64' ;;
            esac
          done

          blockmaps="$(find release -maxdepth 1 -type f -name '*.blockmap' | wc -l | tr -d '[:space:]')"
          if [[ "${blockmaps}" -lt 2 ]]; then
            echo "Expected update blockmaps for both macOS archives; found ${blockmaps}."
            exit 1
          fi

          find release -maxdepth 1 -type f -print | LC_ALL=C sort

      - name: Smoke test packaged macOS app
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) staged=release/mac-arm64 ;;
            x86_64) staged=release/mac ;;
            *) echo 'Unsupported macOS runner architecture'; exit 1 ;;
          esac
          shopt -s nullglob
          apps=("${staged}"/*.app)
          test "${#apps[@]}" -eq 1
          entry="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${apps[0]}/Contents/Info.plist")"
          app_bin="${apps[0]}/Contents/MacOS/${entry}"
          test -x "${app_bin}"
          node tools/release-smoke.cjs "${app_bin}"

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release
            find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name 'latest-mac.yml' \) -print \
              | sed 's#^./##' \
              | LC_ALL=C sort \
              | while IFS= read -r asset; do
                  test -n "${asset}"
                  shasum -a 256 "${asset}"
                done
          ) > release/SHA256SUMS.txt
          test -s release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - name: Archive release assets
        uses: actions/upload-artifact@v4
        with:
          name: TouShou-${{ github.run_id }}-macos
          overwrite: true
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/SHA256SUMS.txt

  # Windows packaging: same gates as the macOS job, then an NSIS installer
  # plus latest.yml/blockmap so the in-app updater has a Windows channel.
  build-windows:
    name: Verify and package (Windows)
    needs: plan
    if: needs.plan.outputs.target == 'windows' || needs.plan.outputs.target == 'all'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Bun for OMP
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Read pinned OMP version
        id: pinned
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .omp-compat-version)"
          test -n "${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install pinned OMP
        run: npm install -g "@oh-my-pi/pi-coding-agent@${{ steps.pinned.outputs.version }}"

      - name: Locate Windows OMP launcher
        shell: bash
        run: |
          set -euo pipefail
          omp_path="$(npm prefix -g)/omp.cmd"
          test -f "${omp_path}" || {
            echo "Missing Windows OMP launcher: ${omp_path}"
            npm prefix -g
            exit 1
          }
          echo "OMP_BIN=${omp_path}" >> "${GITHUB_ENV}"
          echo "Using Windows OMP launcher: ${omp_path}"

      - name: Verify pinned OMP version
        shell: bash
        run: |
          set -euo pipefail
          test -x "${OMP_BIN}" || test -f "${OMP_BIN}"
          installed="$("${OMP_BIN}" --version)"
          expected="omp/${{ steps.pinned.outputs.version }}"
          echo "OMP version tested: ${installed}"
          test "${installed}" = "${expected}"

      - name: OMP compatibility suite
        # Use the resolved absolute launcher path. Node's execFileSync is more
        # reliable with an explicit .cmd path than with Windows PATH/PATHEXT.
        shell: bash
        run: OMP_REQUIRED="${OMP_BIN}" OMP_BIN="${OMP_BIN}" pnpm test:omp

      - name: Build app
        run: pnpm build

      # No Windows signing secrets yet: electron-builder emits an unsigned
      # NSIS installer (SmartScreen-warned) plus the auto-update manifests.
      - name: Package Windows installer
        shell: bash
        run: pnpm exec electron-builder --win nsis --publish never

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "TouShou-x64.exe"
            "latest.yml"
          )

          for asset in "${required[@]}"; do
            test -s "release/${asset}" || {
              echo "Missing or empty release asset: release/${asset}"
              exit 1
            }
          done

          blockmaps="$(find release -maxdepth 1 -type f -name '*.blockmap' | wc -l | tr -d '[:space:]')"
          if [[ "${blockmaps}" -lt 1 ]]; then
            echo "Expected a Windows update blockmap; found ${blockmaps}."
            exit 1
          fi

          find release -maxdepth 1 -type f -print | LC_ALL=C sort

      - name: Smoke test packaged Windows app
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          app_bin="release/win-unpacked/投手.exe"
          test -s "${app_bin}"
          test -s "release/win-unpacked/resources/session-topic/index.ts"
          test -s "release/win-unpacked/resources/mcp-mention/index.ts"
          test -s "release/win-unpacked/resources/appsflyer-toolkit/package.json"
          test -s "release/win-unpacked/resources/appsflyer-toolkit/extensions/index.ts"
          node tools/release-smoke.cjs "${app_bin}"

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release
            find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*.blockmap' -o -name 'latest.yml' \) -print \
              | sed 's#^./##' \
              | LC_ALL=C sort \
              | while IFS= read -r asset; do
                  test -n "${asset}"
                  sha256sum "${asset}"
                done
          ) > release/SHA256SUMS-windows.txt
          test -s release/SHA256SUMS-windows.txt
          cat release/SHA256SUMS-windows.txt

      - name: Archive release assets
        uses: actions/upload-artifact@v4
        with:
          name: TouShou-${{ github.run_id }}-windows
          overwrite: true
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS-windows.txt

  verify-assets:
    name: Verify selected platform artifacts
    needs: [plan, build, build-windows]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ needs.plan.outputs.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected build and allow only intentional skips
        env:
          MAC_RESULT: ${{ needs.build.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
        run: node tools/release-verify.cjs check-builds "$TARGET" "$MAC_RESULT" "$WINDOWS_RESULT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --prod --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        if: env.TARGET != 'windows'
        with:
          name: TouShou-${{ github.run_id }}-macos
          path: artifacts
      - uses: actions/download-artifact@v4
        if: env.TARGET != 'macos'
        with:
          name: TouShou-${{ github.run_id }}-windows
          path: artifacts
      - name: Verify package hashes, updater manifests and checksums
        run: node tools/release-verify.cjs verify "$TARGET" artifacts

  publish:
    name: Verify uploaded assets and publish
    if: ${{ !cancelled() && github.event_name == 'push' && needs.verify-assets.result == 'success' }}
    needs: [plan, verify-assets]
    runs-on: ubuntu-latest
    # Serialize the global version check and publication, even across different tags.
    concurrency:
      group: stable-release-publish
      queue: max
    permissions:
      contents: write
    env:
      TARGET: ${{ needs.plan.outputs.target }}
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --prod --frozen-lockfile --ignore-scripts
      - name: Check release order again after packaging
        id: prior
        run: |
          visibility=$(node tools/release-verify.cjs check-tag)
          echo "visibility=$visibility" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.prior.outputs.visibility == 'unpublished' && env.TARGET != 'windows'
        with:
          name: TouShou-${{ github.run_id }}-macos
          path: artifacts
      - uses: actions/download-artifact@v4
        if: steps.prior.outputs.visibility == 'unpublished' && env.TARGET != 'macos'
        with:
          name: TouShou-${{ github.run_id }}-windows
          path: artifacts
      - name: Create or resume draft and upload verified assets
        if: steps.prior.outputs.visibility == 'unpublished'
        run: |
          set -euo pipefail
          notes="docs/releases/v${VERSION}.md"
          node tools/release-verify.cjs verify "$TARGET" artifacts
          if gh release view "$GITHUB_REF_NAME" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease]|@tsv')" = $'true\tfalse'
            if [[ -f "$notes" ]]; then gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"; fi
          else
            args=(--generate-notes)
            if [[ -f "$notes" ]]; then args=(--notes-file "$notes"); fi
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --latest=false --title "投手 ${GITHUB_REF_NAME}" "${args[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
      - name: Download and verify the release before making it public
        env:
          VISIBILITY: ${{ steps.prior.outputs.visibility }}
        run: |
          set -euo pipefail
          release_dir="$(mktemp -d)"
          trap 'rm -rf "$release_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" --dir "$release_dir"
          node tools/release-verify.cjs verify "$TARGET" "$release_dir"
          if [[ "$VISIBILITY" == unpublished ]]; then
            for sums in artifacts/SHA256SUMS*.txt; do cmp "$sums" "$release_dir/${sums##*/}"; done
            latest=false
            if [[ "$VERSION" == 2.9.8 ]]; then latest=true; fi
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest="$latest"
          fi
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease]|@tsv')" = $'false\tfalse'
          test "$(gh api 'repos/{owner}/{repo}/releases/latest' --jq .tag_name)" = v2.9.8

  promote:
    name: Promote verified platform updates
    if: ${{ !cancelled() && github.event_name == 'push' && needs.publish.result == 'success' }}
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET: ${{ needs.plan.outputs.target }}
      VERSION: ${{ needs.plan.outputs.version }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/promote-release-channels.cjs "$VERSION" "$TARGET"
