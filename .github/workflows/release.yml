name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'tools/release-smoke.cjs'
      - 'tools/release-smoke-processes.cjs'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Preflight platform (manual runs never publish)'
        type: choice
        required: true
        default: all
        options:
          - all
          - windows

# Build/preflight jobs do not get a release-writing token. Only tag staging
# and publication have write permission.
permissions:
  contents: read

# Tags are immutable release identifiers. Never cancel a release while it is
# packaging or uploading its assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package (macOS)
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # package.json#packageManager is the single source of truth for pnpm.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # OMP 17.2+ dispatches its CLI through Bun; keep this minimum runtime
      # explicit so a clean macOS runner cannot install `omp` yet fail to run it.
      - name: Set up Bun for OMP
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(node -p 'require("./package.json").version')"
          expected="v${version}"

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Release workflow must run from a tag, got ${GITHUB_REF_TYPE}."
            exit 1
          fi

          if [[ "${tag}" != "${expected}" ]]; then
            echo "Tag ${tag} does not match package.json version ${version}."
            echo "Create ${expected}, or update package.json before tagging."
            exit 1
          fi

          git rev-parse --verify "refs/tags/${tag}" >/dev/null
          echo "Publishing ${tag} from ${GITHUB_SHA}."

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Read pinned OMP version
        id: pinned
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .omp-compat-version)"
          test -n "${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Pinned OMP version: ${version}"

      - name: Install pinned OMP
        run: npm install -g "@oh-my-pi/pi-coding-agent@${{ steps.pinned.outputs.version }}"

      - name: Verify pinned OMP version
        shell: bash
        run: |
          set -euo pipefail
          command -v omp
          installed="$(omp --version)"
          expected="omp/${{ steps.pinned.outputs.version }}"
          echo "OMP version tested: ${installed}"
          test "${installed}" = "${expected}"

      - name: OMP compatibility suite
        env:
          # The tag must pass against the pinned current OMP. Legacy Pi is
          # independently optional because this release job installs only omp.
          OMP_REQUIRED: omp
        run: pnpm test:omp

      - name: Build app
        run: pnpm build

      - name: Package (signs/notarizes when secrets are configured)
        # Build was already gated above. `--publish never` prevents
        # electron-builder from publishing before checksums are created and the
        # workflow has an auditable list of assets to upload.
        shell: bash
        env:
          # Do not expose empty signing variables as electron-builder inputs:
          # an empty CSC_LINK is interpreted as a local certificate path.
          RELEASE_CSC_LINK: ${{ github.event_name == 'push' && secrets.CSC_LINK || '' }}
          RELEASE_CSC_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.CSC_KEY_PASSWORD || '' }}
          RELEASE_APPLE_ID: ${{ github.event_name == 'push' && secrets.APPLE_ID || '' }}
          RELEASE_APPLE_APP_SPECIFIC_PASSWORD: ${{ github.event_name == 'push' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          RELEASE_APPLE_TEAM_ID: ${{ github.event_name == 'push' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail

          # Keep unsigned builds valid when this repository has no Apple
          # signing secrets. Export all signing/notarization variables only
          # when their required values are actually present.
          if [[ -n "${RELEASE_CSC_LINK:-}" ]]; then
            export CSC_LINK="${RELEASE_CSC_LINK}"
            if [[ -n "${RELEASE_CSC_KEY_PASSWORD:-}" ]]; then
              export CSC_KEY_PASSWORD="${RELEASE_CSC_KEY_PASSWORD}"
            fi
          fi

          if [[ -n "${RELEASE_APPLE_ID:-}" \
            && -n "${RELEASE_APPLE_APP_SPECIFIC_PASSWORD:-}" \
            && -n "${RELEASE_APPLE_TEAM_ID:-}" ]]; then
            export APPLE_ID="${RELEASE_APPLE_ID}"
            export APPLE_APP_SPECIFIC_PASSWORD="${RELEASE_APPLE_APP_SPECIFIC_PASSWORD}"
            export APPLE_TEAM_ID="${RELEASE_APPLE_TEAM_ID}"
          fi

          pnpm exec electron-builder --publish never

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "TouShou-arm64.dmg"
            "TouShou-arm64.zip"
            "TouShou-x64.dmg"
            "TouShou-x64.zip"
            "latest-mac.yml"
          )

          for asset in "${required[@]}"; do
            test -s "release/${asset}" || {
              echo "Missing or empty release asset: release/${asset}"
              exit 1
            }
          done

          # `electron-builder` can reuse a host-architecture Electron bundle
          # when electronDist is pinned locally. Check the staged apps, not
          # just their artifact filenames, before publishing either archive.
          # afterPack adds a shell launcher beside the Mach-O binary. Resolve
          # the declared entry, then inspect its real binary rather than a
          # filesystem-order-dependent find result.
          shopt -s nullglob
          for staged in release/mac-arm64 release/mac; do
            apps=("${staged}"/*.app)
            test "${#apps[@]}" -eq 1
            app_path="${apps[0]}"
            entry="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app_path}/Contents/Info.plist")"
            app_bin="${app_path}/Contents/MacOS/${entry}"
            test -x "${app_bin}"
            if [[ -f "${app_bin}.bin" ]]; then app_bin="${app_bin}.bin"; fi
            test -s "${app_path}/Contents/Resources/session-topic/index.ts"
            test -s "${app_path}/Contents/Resources/appsflyer-toolkit/package.json"
            test -s "${app_path}/Contents/Resources/appsflyer-toolkit/extensions/index.ts"
            case "${staged}" in
              release/mac-arm64) file "${app_bin}" | grep -Eq 'arm64|arm64e' ;;
              release/mac) file "${app_bin}" | grep -Eq 'x86_64|x86-64' ;;
            esac
          done

          blockmaps="$(find release -maxdepth 1 -type f -name '*.blockmap' | wc -l | tr -d '[:space:]')"
          if [[ "${blockmaps}" -lt 2 ]]; then
            echo "Expected update blockmaps for both macOS archives; found ${blockmaps}."
            exit 1
          fi

          find release -maxdepth 1 -type f -print | LC_ALL=C sort

      - name: Smoke test packaged macOS app
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) staged=release/mac-arm64 ;;
            x86_64) staged=release/mac ;;
            *) echo 'Unsupported macOS runner architecture'; exit 1 ;;
          esac
          shopt -s nullglob
          apps=("${staged}"/*.app)
          test "${#apps[@]}" -eq 1
          entry="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${apps[0]}/Contents/Info.plist")"
          app_bin="${apps[0]}/Contents/MacOS/${entry}"
          test -x "${app_bin}"
          node tools/release-smoke.cjs "${app_bin}"

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release
            find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name 'latest-mac.yml' \) -print \
              | sed 's#^./##' \
              | LC_ALL=C sort \
              | while IFS= read -r asset; do
                  test -n "${asset}"
                  shasum -a 256 "${asset}"
                done
          ) > release/SHA256SUMS.txt
          test -s release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - name: Archive release assets
        uses: actions/upload-artifact@v4
        with:
          name: TouShou-${{ github.run_id }}-macos
          overwrite: true
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/SHA256SUMS.txt

  # Windows packaging: same gates as the macOS job, then an NSIS installer
  # plus latest.yml/blockmap so the in-app updater has a Windows channel.
  build-windows:
    name: Verify and package (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Bun for OMP
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Read pinned OMP version
        id: pinned
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .omp-compat-version)"
          test -n "${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install pinned OMP
        run: npm install -g "@oh-my-pi/pi-coding-agent@${{ steps.pinned.outputs.version }}"

      - name: Locate Windows OMP launcher
        shell: bash
        run: |
          set -euo pipefail
          omp_path="$(npm prefix -g)/omp.cmd"
          test -f "${omp_path}" || {
            echo "Missing Windows OMP launcher: ${omp_path}"
            npm prefix -g
            exit 1
          }
          echo "OMP_BIN=${omp_path}" >> "${GITHUB_ENV}"
          echo "Using Windows OMP launcher: ${omp_path}"

      - name: Verify pinned OMP version
        shell: bash
        run: |
          set -euo pipefail
          test -x "${OMP_BIN}" || test -f "${OMP_BIN}"
          installed="$("${OMP_BIN}" --version)"
          expected="omp/${{ steps.pinned.outputs.version }}"
          echo "OMP version tested: ${installed}"
          test "${installed}" = "${expected}"

      - name: OMP compatibility suite
        # Use the resolved absolute launcher path. Node's execFileSync is more
        # reliable with an explicit .cmd path than with Windows PATH/PATHEXT.
        shell: bash
        run: OMP_REQUIRED="${OMP_BIN}" OMP_BIN="${OMP_BIN}" pnpm test:omp

      - name: Build app
        run: pnpm build

      # No Windows signing secrets yet: electron-builder emits an unsigned
      # NSIS installer (SmartScreen-warned) plus the auto-update manifests.
      - name: Package Windows installer
        shell: bash
        run: pnpm exec electron-builder --win nsis --publish never

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "TouShou-x64.exe"
            "latest.yml"
          )

          for asset in "${required[@]}"; do
            test -s "release/${asset}" || {
              echo "Missing or empty release asset: release/${asset}"
              exit 1
            }
          done

          blockmaps="$(find release -maxdepth 1 -type f -name '*.blockmap' | wc -l | tr -d '[:space:]')"
          if [[ "${blockmaps}" -lt 1 ]]; then
            echo "Expected a Windows update blockmap; found ${blockmaps}."
            exit 1
          fi

          find release -maxdepth 1 -type f -print | LC_ALL=C sort

      - name: Smoke test packaged Windows app
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          app_bin="release/win-unpacked/投手.exe"
          test -s "${app_bin}"
          test -s "release/win-unpacked/resources/session-topic/index.ts"
          test -s "release/win-unpacked/resources/appsflyer-toolkit/package.json"
          test -s "release/win-unpacked/resources/appsflyer-toolkit/extensions/index.ts"
          node tools/release-smoke.cjs "${app_bin}"

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release
            find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*.blockmap' -o -name 'latest.yml' \) -print \
              | sed 's#^./##' \
              | LC_ALL=C sort \
              | while IFS= read -r asset; do
                  test -n "${asset}"
                  sha256sum "${asset}"
                done
          ) > release/SHA256SUMS-windows.txt
          test -s release/SHA256SUMS-windows.txt
          cat release/SHA256SUMS-windows.txt

      - name: Archive release assets
        uses: actions/upload-artifact@v4
        with:
          name: TouShou-${{ github.run_id }}-windows
          overwrite: true
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS-windows.txt

  verify-assets:
    name: Verify packaged artifacts (preflight)
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TouShou-${{ github.run_id }}-macos
          path: artifacts/mac
      - uses: actions/download-artifact@v4
        with:
          name: TouShou-${{ github.run_id }}-windows
          path: artifacts/windows
      - name: Verify required files and checksums
        shell: bash
        run: |
          set -euo pipefail
          mac_assets=(TouShou-arm64.dmg TouShou-arm64.zip TouShou-arm64.zip.blockmap TouShou-x64.dmg TouShou-x64.zip TouShou-x64.zip.blockmap latest-mac.yml)
          windows_assets=(TouShou-x64.exe TouShou-x64.exe.blockmap latest.yml)
          for asset in "${mac_assets[@]}"; do test -s "artifacts/mac/${asset}"; done
          for asset in "${windows_assets[@]}"; do test -s "artifacts/windows/${asset}"; done
          test -s artifacts/mac/SHA256SUMS.txt
          test -s artifacts/windows/SHA256SUMS-windows.txt
          for asset in "${mac_assets[@]}"; do
            grep -Fqx "${asset}" <(sed -E 's/^[0-9a-fA-F]{64} [ *]//' artifacts/mac/SHA256SUMS.txt)
          done
          for asset in "${windows_assets[@]}"; do
            grep -Fqx "${asset}" <(sed -E 's/^[0-9a-fA-F]{64} [ *]//' artifacts/windows/SHA256SUMS-windows.txt)
          done
          (cd artifacts/mac && sha256sum --check SHA256SUMS.txt)
          (cd artifacts/windows && sha256sum --check SHA256SUMS-windows.txt)

  stage-release:
    name: Upload verified assets to draft
    if: github.event_name == 'push'
    needs: [build, build-windows, verify-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TouShou-${{ github.run_id }}-macos
          path: artifacts/mac
      - uses: actions/download-artifact@v4
        with:
          name: TouShou-${{ github.run_id }}-windows
          path: artifacts/windows
      - name: Create draft and upload artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(node -p 'require("./package.json").version')"
          test "${tag}" = "v${version}"
          notes="docs/releases/v${version}.md"
          if gh release view "${tag}" >/dev/null 2>&1; then
            test "$(gh release view "${tag}" --json isDraft --jq .isDraft)" = true || {
              echo "Release already published; refusing to overwrite its assets."
              exit 1
            }
            if [[ -f "${notes}" ]]; then
              gh release edit "${tag}" --notes-file "${notes}"
            fi
          else
            if [[ -f "${notes}" ]]; then
              gh release create "${tag}" --title "投手 ${tag}" --notes-file "${notes}" --draft
            else
              gh release create "${tag}" --title "投手 ${tag}" --generate-notes --draft
            fi
          fi
          assets=()
          while IFS= read -r asset; do assets+=("${asset}"); done < <(find artifacts/mac artifacts/windows -maxdepth 1 -type f -print | LC_ALL=C sort)
          test "${#assets[@]}" -gt 0
          gh release upload "${tag}" "${assets[@]}" --clobber

  publish:
    name: Verify uploaded assets and publish
    if: github.event_name == 'push'
    needs: [stage-release, verify-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check all release assets and publish draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          test "$(gh release view "${tag}" --json isDraft --jq .isDraft)" = true || {
            echo "Expected a draft release; refusing to publish."
            exit 1
          }
          release_dir="$(mktemp -d)"
          trap 'rm -rf "${release_dir}"' EXIT
          gh release download "${tag}" --dir "${release_dir}"
          cd "${release_dir}"
          mac_assets=(TouShou-arm64.dmg TouShou-arm64.zip TouShou-arm64.zip.blockmap TouShou-x64.dmg TouShou-x64.zip TouShou-x64.zip.blockmap latest-mac.yml)
          windows_assets=(TouShou-x64.exe TouShou-x64.exe.blockmap latest.yml)
          for asset in "${mac_assets[@]}" "${windows_assets[@]}" SHA256SUMS.txt SHA256SUMS-windows.txt; do
            test -s "${asset}" || { echo "Missing or empty uploaded asset: ${asset}"; exit 1; }
          done
          for asset in "${mac_assets[@]}"; do
            grep -Fqx "${asset}" <(sed -E 's/^[0-9a-fA-F]{64} [ *]//' SHA256SUMS.txt) || {
              echo "Missing macOS checksum: ${asset}"; exit 1;
            }
          done
          for asset in "${windows_assets[@]}"; do
            grep -Fqx "${asset}" <(sed -E 's/^[0-9a-fA-F]{64} [ *]//' SHA256SUMS-windows.txt) || {
              echo "Missing Windows checksum: ${asset}"; exit 1;
            }
          done
          sha256sum --check SHA256SUMS.txt
          sha256sum --check SHA256SUMS-windows.txt
          gh release edit "${tag}" --draft=false
