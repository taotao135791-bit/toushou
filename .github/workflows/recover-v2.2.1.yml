name: Recover verified v2.2.1 publication

# One-time, fixed-source recovery. This workflow never builds application code.
on:
  workflow_dispatch:

permissions: {}

# Same lock as the original tag release; do not race a retry of that workflow.
concurrency:
  group: release-refs/tags/v2.2.1
  cancel-in-progress: false

env:
  GH_REPO: taotao135791-bit/toushou
  RELEASE_TAG: v2.2.1
  RELEASE_VERSION: 2.2.1
  TAG_SHA: 32a6caa400cb9684c3245701464956f2ce4a0dbb
  RECOVERY_SHA: 5a7df827d068b72af530442561a25bdefd1c69a6
  # This verifier is workflow-owned code, never executable content from an artifact.
  VERIFY_RELEASE_ASSETS: |
    import base64, hashlib, pathlib, re, sys

    mac = pathlib.Path(sys.argv[1])
    windows = pathlib.Path(sys.argv[2])
    mac_data = {
        'TouShou-arm64.dmg', 'TouShou-arm64.dmg.blockmap',
        'TouShou-arm64.zip', 'TouShou-arm64.zip.blockmap',
        'TouShou-x64.dmg', 'TouShou-x64.dmg.blockmap',
        'TouShou-x64.zip', 'TouShou-x64.zip.blockmap', 'latest-mac.yml',
    }
    windows_data = {'TouShou-x64.exe', 'TouShou-x64.exe.blockmap', 'latest.yml'}
    mac_files = mac_data | {'SHA256SUMS.txt'}
    windows_files = windows_data | {'SHA256SUMS-windows.txt'}

    def check_directory(root, expected):
        if root.is_symlink() or not root.is_dir():
            raise SystemExit('Expected a regular artifact directory')
        actual = set()
        for item in root.iterdir():
            if item.is_symlink() or not item.is_file() or item.stat().st_size == 0:
                raise SystemExit('Unexpected, symbolic, empty, or non-file artifact entry: ' + item.name)
            actual.add(item.name)
        if actual != expected:
            raise SystemExit('Asset set mismatch; missing=' + repr(sorted(expected - actual)) + '; extra=' + repr(sorted(actual - expected)))

    if mac.resolve() == windows.resolve():
        check_directory(mac, mac_files | windows_files)
    else:
        check_directory(mac, mac_files)
        check_directory(windows, windows_files)

    def digest(path):
        result = hashlib.sha256()
        with path.open('rb') as stream:
            for block in iter(lambda: stream.read(1024 * 1024), b''):
                result.update(block)
        return result.hexdigest()

    def verify_checksums(root, name, expected):
        seen = set()
        for line in (root / name).read_text(encoding='ascii').splitlines():
            match = re.fullmatch(r'([0-9a-fA-F]{64}) [ *]([A-Za-z0-9._-]+)', line)
            if match is None:
                raise SystemExit('Malformed checksum entry in ' + name)
            recorded, filename = match.groups()
            if filename not in expected or filename in seen:
                raise SystemExit('Unexpected or duplicate checksum entry: ' + filename)
            if digest(root / filename) != recorded.lower():
                raise SystemExit('Checksum mismatch: ' + filename)
            seen.add(filename)
        if seen != expected:
            raise SystemExit('Incomplete checksum coverage in ' + name)

    verify_checksums(mac, 'SHA256SUMS.txt', mac_data)
    verify_checksums(windows, 'SHA256SUMS-windows.txt', windows_data)
    def payload_sha512(path):
        result = hashlib.sha512()
        with path.open('rb') as stream:
            for block in iter(lambda: stream.read(1024 * 1024), b''):
                result.update(block)
        return base64.b64encode(result.digest()).decode('ascii')

    for root, manifest, required_payloads, allowed_payloads in (
        (mac, 'latest-mac.yml', {'TouShou-arm64.zip', 'TouShou-x64.zip'},
         {'TouShou-arm64.zip', 'TouShou-x64.zip', 'TouShou-arm64.dmg', 'TouShou-x64.dmg'}),
        (windows, 'latest.yml', {'TouShou-x64.exe'}, {'TouShou-x64.exe'}),
    ):
        # Parse only the exact, plain scalar layout emitted by the pinned
        # electron-builder. No YAML tags, aliases, duplicate keys, or extensions.
        lines = (root / manifest).read_text(encoding='utf-8').splitlines()
        if lines[:2] != ['version: 2.2.1', 'files:']:
            raise SystemExit('Wrong or noncanonical update version/files in ' + manifest)
        index, entries = 2, {}
        while index < len(lines) and lines[index].startswith('  - url: '):
            if index + 2 >= len(lines):
                raise SystemExit('Incomplete updater file entry in ' + manifest)
            url = re.fullmatch(r'  - url: ([A-Za-z0-9._-]+)', lines[index])
            sha = re.fullmatch(r'    sha512: ([A-Za-z0-9+/]{86}==)', lines[index + 1])
            size = re.fullmatch(r'    size: ([1-9][0-9]*)', lines[index + 2])
            if url is None or sha is None or size is None:
                raise SystemExit('Noncanonical updater file entry in ' + manifest)
            filename, recorded_sha, recorded_size = url[1], sha[1], int(size[1])
            if filename not in allowed_payloads or filename in entries:
                raise SystemExit('Unexpected or duplicate updater payload in ' + manifest)
            path = root / filename
            expected_sha = payload_sha512(path)
            if recorded_sha != expected_sha or recorded_size != path.stat().st_size:
                raise SystemExit('Updater payload SHA-512 or size mismatch: ' + filename)
            entries[filename] = expected_sha
            index += 3
        if not required_payloads.issubset(entries):
            raise SystemExit('Missing required updater payload in ' + manifest)
        if len(lines) - index != 3:
            raise SystemExit('Unexpected or duplicate updater root fields in ' + manifest)
        legacy_path = re.fullmatch(r'path: ([A-Za-z0-9._-]+)', lines[index])
        legacy_sha = re.fullmatch(r'sha512: ([A-Za-z0-9+/]{86}==)', lines[index + 1])
        release_date = re.fullmatch(r"releaseDate: (?:'[0-9T:.+Z-]+'|\"[0-9T:.+Z-]+\"|[0-9T:.+Z-]+)", lines[index + 2])
        if legacy_path is None or legacy_sha is None or release_date is None:
            raise SystemExit('Noncanonical legacy updater fields in ' + manifest)
        if legacy_path[1] not in entries or legacy_sha[1] != entries[legacy_path[1]]:
            raise SystemExit('Legacy updater path/SHA-512 mismatch in ' + manifest)
    print('Verified 14 release files, 12 complete SHA-256 entries, and both 2.2.1 manifests with payload SHA-512, sizes, and legacy fields.')

jobs:
  verify:
    name: Verify fixed sources and both asset sets
    if: github.repository == 'taotao135791-bit/toushou' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.2.1
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable tag and test-only recovery delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TAG_SHA}"
          test "$(git rev-parse 'refs/tags/v2.2.1^{commit}')" = "${TAG_SHA}"
          test "$(node -p 'require("./package.json").version')" = "${RELEASE_VERSION}"
          test -s docs/releases/v2.2.1.md
          git cat-file -e "${RECOVERY_SHA}^{commit}"
          python3 - <<'PY'
          import os, subprocess
          expected = {
              '.github/workflows/ci.yml',
              '.github/workflows/release.yml',
              'src/renderer/lib/transcriptScroll.harness.cjs',
          }
          actual = set(subprocess.check_output([
              'git', 'diff', '--no-renames', '--name-only',
              os.environ['TAG_SHA'], os.environ['RECOVERY_SHA'],
          ], text=True).splitlines())
          if actual != expected:
              raise SystemExit('Recovery delta is not exactly the three reviewed CI/test files: ' + repr(sorted(actual)))
          print('Fixed tag and recovery SHA verified; all product source and packaging inputs match the tag.')
          PY

      - name: Require successful fixed source jobs and main CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          repo = 'taotao135791-bit/toushou'
          tag_sha = '32a6caa400cb9684c3245701464956f2ce4a0dbb'
          recovery_sha = '5a7df827d068b72af530442561a25bdefd1c69a6'

          def api(suffix):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + suffix], text=True))

          def run(run_id, sha, event, branch, path, success):
              value = api('/actions/runs/' + str(run_id))
              expected = {
                  'id': run_id, 'head_sha': sha, 'event': event,
                  'head_branch': branch, 'path': path, 'status': 'completed',
              }
              for key, expected_value in expected.items():
                  if value.get(key) != expected_value:
                      raise SystemExit('Source run ' + str(run_id) + ' failed fixed metadata/status check: ' + key)
              if value.get('repository', {}).get('full_name') != repo:
                  raise SystemExit('Source run repository mismatch')
              if success and value.get('conclusion') != 'success':
                  raise SystemExit('Source run is not successful: ' + str(run_id))
              return value

          mac = run(41793697690, tag_sha, 'push', 'v2.2.1', '.github/workflows/release.yml', False)
          run(41796581756, recovery_sha, 'workflow_dispatch', 'main', '.github/workflows/release.yml', True)
          run(41796499977, recovery_sha, 'push', 'main', '.github/workflows/ci.yml', True)

          required = {
              'macOS': [
                  'Typecheck', 'Unit tests', 'OMP compatibility suite', 'Build app',
                  'Package (signs/notarizes when secrets are configured)',
                  'Verify release assets', 'Smoke test packaged macOS app',
                  'Generate SHA-256 checksums', 'Archive release assets',
              ],
              'Windows': [
                  'Typecheck', 'Unit tests', 'OMP compatibility suite', 'Build app',
                  'Package Windows installer', 'Verify release assets',
                  'Smoke test packaged Windows app', 'Generate SHA-256 checksums',
                  'Archive release assets',
              ],
          }
          for run_id, platform, sha, artifact_name in (
              (41793697690, 'macOS', tag_sha, 'TouShou-41793697690-macos'),
              (41796581756, 'Windows', recovery_sha, 'TouShou-41796581756-windows'),
          ):
              jobs = api('/actions/runs/' + str(run_id) + '/jobs?filter=latest&per_page=100')['jobs']
              selected = [job for job in jobs if job.get('name') == 'Verify and package (' + platform + ')']
              if len(selected) != 1 or selected[0].get('conclusion') != 'success' or selected[0].get('head_sha') != sha:
                  raise SystemExit('Expected successful fixed ' + platform + ' job')
              steps = selected[0].get('steps', [])
              for name in required[platform]:
                  matches = [step for step in steps if step.get('name') == name]
                  if len(matches) != 1 or matches[0].get('conclusion') != 'success':
                      raise SystemExit('Missing successful ' + platform + ' step: ' + name)
              artifacts = api('/actions/runs/' + str(run_id) + '/artifacts?per_page=100')['artifacts']
              matches = [item for item in artifacts if item.get('name') == artifact_name]
              if len(matches) != 1 or matches[0].get('expired') is not False or matches[0].get('size_in_bytes', 0) <= 0:
                  raise SystemExit('Expected one nonexpired source artifact: ' + artifact_name)
              source = matches[0].get('workflow_run', {})
              if source.get('id') != run_id or source.get('head_sha') != sha:
                  raise SystemExit('Artifact workflow provenance mismatch: ' + artifact_name)
              print('Verified source ' + str(run_id) + ': ' + platform + ', successful gates and exact artifact provenance.')
          print('Main CI and product-equivalent Windows recovery SHA verified.')
          PY

      - name: Download original tag macOS assets
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: taotao135791-bit/toushou
          run-id: 41793697690
          name: TouShou-41793697690-macos
          path: artifacts/mac

      - name: Download successful Windows recovery assets
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: taotao135791-bit/toushou
          run-id: 41796581756
          name: TouShou-41796581756-windows
          path: artifacts/windows

      - name: Verify complete collections, checksums, and updater versions
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "${VERIFY_RELEASE_ASSETS}" artifacts/mac artifacts/windows
          mkdir verified
          cp -- artifacts/mac/* artifacts/windows/* verified/
          python3 -c "${VERIFY_RELEASE_ASSETS}" verified verified
          (cd verified && sha256sum --check SHA256SUMS.txt && sha256sum --check SHA256SUMS-windows.txt)
          {
            echo '### Fixed v2.2.1 recovery sources'
            echo '- Immutable tag: v2.2.1 / 32a6caa400cb9684c3245701464956f2ce4a0dbb'
            echo '- macOS: Release 41793697690, successful macOS job'
            echo '- Windows: Release 41796581756 / 5a7df827d068b72af530442561a25bdefd1c69a6'
            echo '- Main CI: 41796499977, successful'
            echo '- Recovery source differs only in the three reviewed CI/test-harness files.'
            echo '- Both complete platform collections, SHA-256 lists, and 2.2.1 updater manifests verified.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Hand off only the verified release collection
        uses: actions/upload-artifact@v4
        with:
          name: TouShou-v2.2.1-recovery-verified
          path: verified/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    name: Recheck uploaded collection and publish fixed release
    if: github.repository == 'taotao135791-bit/toushou' && github.event_name == 'workflow_dispatch'
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.2.1
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck immutable tag before any release write
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TAG_SHA}"
          test "$(git rev-parse 'refs/tags/v2.2.1^{commit}')" = "${TAG_SHA}"
          test "$(node -p 'require("./package.json").version')" = "${RELEASE_VERSION}"
          test -s docs/releases/v2.2.1.md

      - name: Download this run's verified collection
        uses: actions/download-artifact@v4
        with:
          name: TouShou-v2.2.1-recovery-verified
          path: verified

      - name: Validate handed-off collection before release write
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "${VERIFY_RELEASE_ASSETS}" verified verified

      - name: Create or update draft and upload only verified files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote --exit-code origin 'refs/tags/v2.2.1^{}' | cut -f1)" = "${TAG_SHA}"
          if gh release view "${RELEASE_TAG}" --json tagName,isDraft,assets > existing-release.json; then
            python3 - <<'PY'
          import json, pathlib
          value = json.loads(pathlib.Path('existing-release.json').read_text())
          expected = {item.name for item in pathlib.Path('verified').iterdir()}
          if value.get('tagName') != 'v2.2.1' or value.get('isDraft') is not True:
              raise SystemExit('Refusing to overwrite a non-draft or mismatched release')
          assets = value.get('assets', [])
          names = [item['name'] for item in assets]
          if len(names) != len(set(names)) or not set(names).issubset(expected):
              raise SystemExit('Existing draft contains unexpected or duplicate assets; refusing to change it')
          PY
            gh release edit "${RELEASE_TAG}" --title '投手 v2.2.1' --notes-file docs/releases/v2.2.1.md
          else
            gh release create "${RELEASE_TAG}" --verify-tag --target "${TAG_SHA}" --title '投手 v2.2.1' --notes-file docs/releases/v2.2.1.md --draft
          fi
          gh release upload "${RELEASE_TAG}" verified/* --clobber

      - name: Independently download and verify GitHub draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" = true
          gh release view "${RELEASE_TAG}" --json tagName,isDraft,assets > uploaded-release.json
          python3 - <<'PY'
          import json, pathlib
          value = json.loads(pathlib.Path('uploaded-release.json').read_text())
          expected = {item.name: item.stat().st_size for item in pathlib.Path('verified').iterdir()}
          assets = value.get('assets', [])
          names = [item['name'] for item in assets]
          if value.get('tagName') != 'v2.2.1' or value.get('isDraft') is not True:
              raise SystemExit('Release changed before verification')
          if len(names) != len(expected) or set(names) != set(expected):
              raise SystemExit('Uploaded asset set differs from the verified collection')
          if any(item.get('state') != 'uploaded' or item.get('size') != expected[item['name']] for item in assets):
              raise SystemExit('Uploaded asset state or size mismatch')
          PY
          mkdir downloaded
          gh release download "${RELEASE_TAG}" --dir downloaded
          python3 -c "${VERIFY_RELEASE_ASSETS}" downloaded downloaded
          (cd downloaded && sha256sum --check SHA256SUMS.txt && sha256sum --check SHA256SUMS-windows.txt)
          python3 - <<'PY'
          import hashlib, pathlib
          expected, actual = pathlib.Path('verified'), pathlib.Path('downloaded')
          def digest(path):
              result = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b''):
                      result.update(block)
              return result.digest()
          if {item.name for item in expected.iterdir()} != {item.name for item in actual.iterdir()}:
              raise SystemExit('Re-downloaded file set mismatch')
          for source in expected.iterdir():
              if digest(source) != digest(actual / source.name):
                  raise SystemExit('Re-downloaded file differs: ' + source.name)
          print('All 14 uploaded and re-downloaded files match the verified handoff, including both checksum lists.')
          PY

      - name: Publish only the verified stable draft as latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote --exit-code origin 'refs/tags/v2.2.1^{}' | cut -f1)" = "${TAG_SHA}"
          test "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" = true
          gh release edit "${RELEASE_TAG}" --draft=false --prerelease=false --latest
          {
            echo '### Published v2.2.1 after equivalent recovery gates'
            echo '- All 14 files match the verified collection after downloading from GitHub.'
            echo '- Both platform checksum lists and 2.2.1 updater manifests were rechecked.'
            echo '- Original tag and macOS source were preserved; Windows used the product-equivalent recovery run.'
          } >> "${GITHUB_STEP_SUMMARY}"
